---
-  name: installing tomcat
   hosts: all
   become: true
   
   tasks:
   -  name: installing java
      yum:
        pkg: java
        state: installed

   -  name: downloading tomcat
      get_url:
        url: https://dlcdn.apache.org/tomcat/tomcat-11/v11.0.27/bin/apache-tomcat-11.0.27.tar.gz
        dest: /opt
        
   -  name: extracting tar
      unarchive:
        src: /opt/apache-tomcat-11.0.27.tar.gz
        dest: /opt 
        remote_src: yes
   -  name: giving permission
      file:
        path: /opt/apache-tomcat-11.0.27/bin/startup.sh
        mode: 0777
        
   -  name: starting startup.sh file
      shell: nohup ./startup.sh
      args:
        chdir: /opt/apache-tomcat-11.0.27/bin
